name: Management and packaging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare disposable test workspace
        run: mkdir -p lab/work
      - name: Management and package regressions
        run: python3 -B -m unittest discover -s lab/tests -v
      - name: Rescue tool regressions
        run: python3 -B -m unittest discover -s ram-rescue-demo/tests -v
