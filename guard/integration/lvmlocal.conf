# Protected boot only. Explicit activation uses the stable map; the raw PV
# remains available solely to Guard's separate, read-only admission runtime.
devices {
    use_devicesfile = 0
    filter = [ "a|^/dev/mapper/ram-rescue-path$|", "r|.*|" ]
    global_filter = [ "a|^/dev/mapper/ram-rescue-path$|", "r|.*|" ]
}
global {
    event_activation = 0
}
