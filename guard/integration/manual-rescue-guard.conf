# Runtime-only override: the initramfs already prepared this shared RAM root.
[Unit]
ConditionKernelCommandLine=ram_rescue_guard=1
After=ram-rescue-guard.service

[Service]
RootDirectory=/run/ram-rescue-demo
ExecStart=
ExecStart=/bin/busybox sh /opt/guard/prepare-shared-rescue
ExecStartPost=
ExecStop=
